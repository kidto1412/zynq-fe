<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#4edeaa" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Grid Accents -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Top Category Pill -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#132238" stroke="#00f0ff" stroke-width="1.5" />
    <text x="155" y="24" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" text-anchor="middle">
      WEBRTC HIGH-SPEED P2P
    </text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      ZYNQ
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="url(#textCyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">
      Universal Cross-Ecosystem Sync &amp; Share
    </text>

    <!-- Description -->
    <text x="0" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Kirim berkas raksasa &amp; sinkronisasi clipboard antar iPhone, Android, Mac, &amp; Windows
    </text>
    <text x="0" y="268" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      langsung di peramban tanpa instalasi aplikasi, tanpa cloud, dan tanpa kompresi.
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 320)">
      <!-- Badge 1: Speed -->
      <rect x="0" y="0" width="220" height="52" rx="14" fill="#151e32" stroke="#233354" stroke-width="1.5" />
      <text x="25" y="32" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">
        ⚡ 30–80 MB/s Speed
      </text>

      <!-- Badge 2: Offline Hotspot -->
      <rect x="240" y="0" width="230" height="52" rx="14" fill="#151e32" stroke="#233354" stroke-width="1.5" />
      <text x="265" y="32" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">
        📶 0 KB Kuota Hotspot
      </text>

      <!-- Badge 3: Guest Drop Link -->
      <rect x="490" y="0" width="240" height="52" rx="14" fill="#151e32" stroke="#233354" stroke-width="1.5" />
      <text x="515" y="32" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">
        🔗 Guest Drop Link
      </text>

      <!-- Badge 4: Universal Clipboard -->
      <rect x="750" y="0" width="245" height="52" rx="14" fill="#151e32" stroke="#233354" stroke-width="1.5" />
      <text x="775" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">
        📋 Universal Clipboard
      </text>
    </g>

    <!-- URL Tagline -->
    <text x="0" y="440" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
      🌐 https://zynq.web.id   •   PWA Ready   •   Zero Cloud Retention
    </text>
  </g>
</svg>
