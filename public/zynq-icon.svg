<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1A2238" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>

    <!-- Electric Cyan to Quantum Purple Primary Beam -->
    <linearGradient id="beam-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#4C82FB" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Secondary Energetic Neon Beam -->
    <linearGradient id="beam-secondary" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <!-- Core Sync Light Ray -->
    <linearGradient id="sync-ray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter for Gen-Z Cyber Tactile Pop -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="radar-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" />
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Radar Orbit Rings (Sync & Discovery Essence) -->
  <circle cx="256" cy="256" r="190" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="140" stroke="rgba(121, 40, 202, 0.12)" stroke-width="1.5" />

  <!-- P2P Synchronizing Nodes (Gen-Z Satellite Accents) -->
  <circle cx="116" cy="116" r="5" fill="#00F0FF" filter="url(#radar-glow)" opacity="0.8" />
  <circle cx="396" cy="396" r="5" fill="#FF0080" filter="url(#radar-glow)" opacity="0.8" />

  <!-- Main Z-Beam Glyph (Dynamic Precision Chamfers) -->
  <g filter="url(#neon-glow)">
    <!-- Top-Right Anchor Arm -->
    <path
      d="M148 144 H340 C357.673 144 372 158.327 372 176 C372 184.819 368.36 193.248 362 199.3 L238 318 H356 C364.837 318 372 325.163 372 334 C372 342.837 364.837 350 356 350 H310 L370 292 C376.5 285.5 380 276.5 380 267 C380 257.5 376.5 248.5 370 242 L260 136 C254 130 245 126 236 126 H148 C139.163 126 132 133.163 132 142 C132 150.837 139.163 144 148 144 Z"
      fill="url(#beam-primary)"
      opacity="0.15"
    />

    <!-- Upper Synchronizing Wing (Top Half of 'Z') -->
    <path
      d="M 136 148 C 136 137 145 128 156 128 H 344 C 360 128 373 141 373 157 C 373 166 369 175 362 182 L 236 304 H 308 C 316 304 322 310 322 318 C 322 326 316 332 308 332 H 192 L 314 214 C 322 206 327 195 327 184 C 327 169 315 156 300 156 H 156 C 145 156 136 147 136 148 Z"
      fill="url(#beam-primary)"
    />

    <!-- Lower Synchronizing Wing (Bottom Half of 'Z' - Dual Intersecting Beam) -->
    <path
      d="M 376 364 C 376 375 367 384 356 384 H 168 C 152 384 139 371 139 355 C 139 346 143 337 150 330 L 276 208 H 204 C 196 208 190 202 190 194 C 190 186 196 180 204 180 H 320 L 198 298 C 190 306 185 317 185 328 C 185 343 197 356 212 356 H 356 C 367 356 376 363 376 364 Z"
      fill="url(#beam-secondary)"
    />

    <!-- Quantum Intersect Beam Flare (Negative Space Conduit Bridge) -->
    <polygon
      points="208,248 304,264 256,256"
      fill="#FFFFFF"
      opacity="0.9"
    />

    <!-- Central Pulse Node (WebRTC Instant Lock) -->
    <circle cx="256" cy="256" r="9" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="16" stroke="url(#sync-ray)" stroke-width="3" opacity="0.85" />
  </g>
</svg>
