<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <!-- Cyan to Violet Gradient -->
    <linearGradient id="logo-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Hot Magenta Gradient -->
    <linearGradient id="logo-magenta" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON SECTION (x: 20 to 220) -->
  <g transform="translate(20, 20) scale(0.39)">
    <!-- Squircle Frame -->
    <rect width="512" height="512" rx="128" fill="#0B0F19" />
    <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

    <!-- Radar Rings -->
    <circle cx="256" cy="256" r="190" stroke="rgba(0, 240, 255, 0.15)" stroke-width="3" stroke-dasharray="8 12" />
    <circle cx="256" cy="256" r="130" stroke="rgba(147, 51, 234, 0.2)" stroke-width="2.5" />

    <!-- Upper Wing -->
    <path
      d="M 136 148 C 136 137 145 128 156 128 H 344 C 360 128 373 141 373 157 C 373 166 369 175 362 182 L 236 304 H 308 C 316 304 322 310 322 318 C 322 326 316 332 308 332 H 192 L 314 214 C 322 206 327 195 327 184 C 327 169 315 156 300 156 H 156 C 145 156 136 147 136 148 Z"
      fill="url(#logo-cyan-violet)"
    />

    <!-- Lower Wing -->
    <path
      d="M 376 364 C 376 375 367 384 356 384 H 168 C 152 384 139 371 139 355 C 139 346 143 337 150 330 L 276 208 H 204 C 196 208 190 202 190 194 C 190 186 196 180 204 180 H 320 L 198 298 C 190 306 185 317 185 328 C 185 343 197 356 212 356 H 356 C 367 356 376 363 376 364 Z"
      fill="url(#logo-magenta)"
    />

    <!-- Pulse Core -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="22" stroke="#00F0FF" stroke-width="4" opacity="0.8" />
  </g>

  <!-- TYPOGRAPHY: Z Y N Q -->
  <g transform="translate(250, 42)">
    <!-- Wordmark ZYNQ -->
    <text
      x="0"
      y="105"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif"
      font-size="108"
      font-weight="900"
      letter-spacing="6"
    >
      ZYN
    </text>

    <!-- Stylized 'Q' with Orbit Beam -->
    <text
      x="255"
      y="105"
      fill="url(#logo-cyan-violet)"
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif"
      font-size="108"
      font-weight="900"
      letter-spacing="6"
    >
      Q
    </text>

    <!-- Radar Sub-Bevel Dot inside Q -->
    <circle cx="330" cy="80" r="8" fill="#00F0FF" filter="url(#glow-light)" />

    <!-- Subtitle: SYNC & SHARE -->
    <g transform="translate(4, 142)">
      <rect width="18" height="4" rx="2" fill="#00F0FF" />
      <text
        x="32"
        y="12"
        fill="#94A3B8"
        font-family="'JetBrains Mono', monospace"
        font-size="20"
        font-weight="700"
        letter-spacing="8"
      >
        SYNC &amp; SHARE
      </text>
      <rect x="290" width="80" height="4" rx="2" fill="url(#logo-cyan-violet)" />
    </g>
  </g>
</svg>
